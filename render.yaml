services:
  # 1. FastAPI Backend + Whisper + ML Engine
  - type: web
    name: salesgenie-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8000
      - key: NVIDIA_API_KEY
        sync: false
      - key: WHISPER_MODEL_NAME
        value: base

  # 2. Vite React Frontend
  - type: web
    name: salesgenie-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: salesgenie-backend
          property: host
